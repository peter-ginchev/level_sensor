# Particle Compile Action Workflow
# This workflow uses the Particle compile-action to compile Particle application firmware.
# Make sure to set the particle-platform-name for your project.
# For complete documentation, please refer to https://github.com/particle-iot/compile-action

name: Particle Compile

on:
  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      # The vendored libraries (notably the Adafruit submodules) ship their upstream
      # examples inside compiled 'src/' paths. Particle's buildpack compiles every
      # source it finds under src/ and lib/*/src/, so those examples get built too and
      # some fail to compile. They are irrelevant to this firmware, so strip them
      # before compiling. (particle.ignore/particle.include are legacy and no longer
      # honored, so this is done here instead.)
      - name: Strip library examples and tests
        run: |
          find lib -depth -type d \( -name examples -o -name test -o -name tests \) -exec rm -rf {} +

      # Particle Compile Action
      - name: Compile Firmware
        id: compile
        uses: particle-iot/compile-action@v1
        with:
          # Set the particle-platform-name to the platform you're targeting.
          # Allowed values: core, photon, p1, electron, argon, boron, xenon, esomx, bsom, b5som, tracker, trackerm, p2, msom
          particle-platform-name: 'p2'

      # Optional: Upload compiled firmware as an artifact on GitHub.
      - name: Upload Firmware as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifact
          path: |
            ${{ steps.compile.outputs.firmware-path }}
            ${{ steps.compile.outputs.target-path }}
